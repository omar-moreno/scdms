apiVersion: apps/v1
kind: Deployment
metadata:
  name: titan-http-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: titan-http-server
  template:
    metadata:
      labels:
        app:  titan-http-server
    spec:
      containers:
        - name: apache
          image: omarmoreno/titan-dev:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: apache-config-volume
              mountPath: /etc/apache2/sites-available/000-default.conf
              subPath: apache-site.conf
            - name: supercdms-public-html
              mountPath: /sdf/data/supercdms/public_html/cdms
      volumes:
        - name: apache-config-volume
          configMap:
            name: apache-config
        - name: supercdms-public-html
          hostPath:
             path: /sdf/data/supercdms/public_html/cdms
             type: Directory
