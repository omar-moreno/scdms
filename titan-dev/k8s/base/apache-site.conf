<VirtualHost *:80>
    ServerAdmin root@localhost
    DocumentRoot /sdf/data/supercdms/public_html/cdms

    <Directory /sdf/data/supercdms/public_html/cdms>
        # Enables Server-Side Includes (SSI) via <!-- #include .. --> in .shtml
        # files and disables the ability to execute commands via #exec 
        # inside SSI files. Also allow following symbolic links in the 
        # directory.
        Options IncludesNOEXEC FollowSymLinks

	# Allow the following settings to be overriden in .htaccess
	AllowOverride Options Indexes AuthConfig Limit

	# Grant access to everyone regardless of IP, user or authentication
	Require all granted
    </Directory>
    	
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
